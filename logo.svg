<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Dark Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#323232"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Subtle Glass Shine Overlay -->
  <path d="M0 110 Q0 0 110 0 H402 Q512 0 512 110 V220 L0 120 Z" fill="white" fill-opacity="0.07"/>

  <!-- Inner Stroke for Definition -->
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="4"/>

  <!-- CP Monogram -->
  <text x="50%" y="54%" font-family="Arial, sans-serif" font-weight="900" font-size="260" fill="#DDF676" text-anchor="middle" dominant-baseline="middle" letter-spacing="-12" filter="url(#neon-glow)">CP</text>
</svg>