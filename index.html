
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" id="theme-color-meta"/>
    
    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CPenterprices">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./logo.svg">
    <link rel="apple-touch-icon" href="./logo.svg">
    <link rel="apple-touch-startup-image" href="./logo.svg">
    
    <title>CPenterprices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              light: {
                base: '#F3F4F6',    
                surface: '#FFFFFF', 
                surface2: '#F9FAFB',
                text: '#111827',    
                body: '#4B5563',    
                border: '#E5E7EB',
              },
              dark: {
                base: '#000000',    
                surface: '#121212', 
                surface2: '#1E1E1E',
                text: '#F9FAFB',
                body: '#9CA3AF',
                border: '#27272A',
              },
              lime: {
                DEFAULT: '#DDF676', 
                hover: '#CBE660',
                text: '#1A1A1A'     
              },
              black: {
                DEFAULT: '#111111',
                hover: '#000000'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            borderRadius: {
              'sm': '6px',
              'DEFAULT': '10px',
              'md': '12px',
              'lg': '16px',      
              'xl': '20px',      
              '2xl': '24px',     
              '3xl': '32px',     
              '4xl': '40px',     
              'full': '9999px',  
            },
            boxShadow: {
              'soft': '0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)', 
              'soft-hover': '0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)',
              'glow-lime': '0 0 0 2px rgba(221, 246, 118, 0.5)',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 0px; background: transparent; }
      .custom-scrollbar-hide::-webkit-scrollbar { display: none; }
      .custom-scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .bento-card { 
        @apply bg-light-surface dark:bg-dark-surface rounded-3xl shadow-soft border border-gray-100 dark:border-white/5;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        transform: translateZ(0);
      }
      .btn-black { @apply bg-black dark:bg-white text-white dark:text-black hover:bg-gray-900 dark:hover:bg-gray-200 transition-colors rounded-full font-semibold shadow-sm active:scale-95 flex items-center justify-center; }
      .btn-lime { @apply bg-lime text-lime-text hover:bg-lime-hover transition-colors rounded-full font-semibold shadow-sm active:scale-95 flex items-center justify-center; }
      .bento-input { @apply bg-light-surface2 dark:bg-dark-surface2 border-none rounded-xl text-light-text dark:text-dark-text placeholder-gray-400 focus:ring-2 focus:ring-lime transition-all shadow-sm; }
      .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .gpu-accelerated { transform: translateZ(0); backface-visibility: hidden; perspective: 1000px; }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
</head>
  <body class="bg-light-base dark:bg-dark-base text-light-text dark:text-dark-text transition-colors duration-200 min-h-screen selection:bg-lime selection:text-black">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(error => {
            console.log('Service Worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
